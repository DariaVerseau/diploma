services:
  migrate:
    image: juhokoskela/goose:latest
    volumes:
      - ./backend/migrations:/migrations:ro
    environment:
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - image-net
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
    ports:
      - "8080:8080"
    working_dir: /app
    volumes:
      - ./uploads:/app/uploads
      - ./style:/app/style
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - image-net
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - image-net
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    env_file:
      - ./ml-service/.env
    environment:
      - DEVICE=cpu
    volumes:
      - ./style:/app/style
    networks:
      - image-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - image-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  image-net:
    driver: bridge