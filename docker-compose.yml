services:
  migrate:
    image: juhokoskela/goose@sha256:f08c8a3b59c91f4df992ad07e4c9e118242105c3f113dbc4565f4c5a42af1f4d
    volumes:
      - ./backend/migrations:/migrations:ro
    environment:
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - image-net
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
    ports:
      - "8080:8080"
    working_dir: /app
    volumes:
      - ./uploads:/app/uploads
      - ./style:/app/style
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - image-net
    restart: unless-stopped

  db:
    image: postgres@sha256:724292da1f2e50bdccfc3302ce75bbba7f4a6076701b588cc795fcac65683550
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports убраны — только из docker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - image-net
    restart: always   # ← для БД

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    env_file:
      - ./ml-service/.env
    environment:
      - DEVICE=cpu
    volumes:
      - ./style:/app/style
    networks:
      - image-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - image-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:

networks:
  image-net:
    driver: bridge